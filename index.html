<style>
:root{--cy:#5ee7ff;--ink:#0d1325;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;touch-action:manipulation;height:100%;margin:0;background:#03040c;overflow:hidden;font-family:'Cairo',Tahoma,Arial,sans-serif;color:#e8fbff;user-select:none}
#box{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px)}
#stage{position:absolute;left:50%;top:50%;width:360px;height:640px;margin:-320px 0 0 -180px;transform:scale(var(--s,1));overflow:hidden;border-radius:16px;background:linear-gradient(#070b24,#1a1250 60%,#2a1250);box-shadow:0 0 0 3px #1c2a55,0 18px 60px #000}
#bg{position:absolute;inset:0}
.tn{animation:tn 3s ease-in-out infinite alternate}@keyframes tn{from{opacity:.25}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:22px 18px 22px;text-align:center}
.screen.active{display:flex}
.tw-on{animation:pop .6s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:var(--d,0s)}
@keyframes pop{from{transform:scale(0) rotate(-8deg);opacity:0}}
.flt{animation:flt 3.2s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-7px)}}
.spin{animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ic{width:100%;height:100%;overflow:visible}
button{font-family:inherit;cursor:pointer;border:0;padding:0;color:inherit;background:none}
.btn{font-weight:900;border-radius:16px;padding:10px 28px;font-size:22px;transition:transform .1s,filter .15s;line-height:1.15}
.btn:hover{filter:brightness(1.15);transform:scale(1.04)}.btn:active{transform:translateY(4px) scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.or{background:linear-gradient(#ffb04a,#d9751c);border:3px solid #ffd79a;color:#fff;box-shadow:0 5px 0 #8a4a10,0 0 22px #ff9a3c88;display:flex;align-items:center;gap:10px;text-shadow:0 2px 0 #8a4a10}
.or small{display:block;font-size:12px;font-weight:700;opacity:.9}
.cb{background:linear-gradient(#7defff,#2ab4d6);border:3px solid #bff6ff;color:#05233a;box-shadow:0 5px 0 #14708a,0 0 20px #5ee7ff88}
.gb{background:linear-gradient(#8af0b2,#2faa63);border:3px solid #d2ffe3;color:#06301a;box-shadow:0 5px 0 #17653a}
.rb{background:linear-gradient(#ff8f8f,#d93d4a);border:3px solid #ffd0d0;color:#fff;box-shadow:0 5px 0 #84202a}
.ghost{font-size:14px;font-weight:700;color:var(--cy);border:2px solid #5ee7ff66;border-radius:12px;padding:4px 12px}
.plate{border:4px solid #7f9bb4;border-radius:16px;background:linear-gradient(#17314f,#0b1a30);box-shadow:inset 0 0 0 3px #0b1a30,inset 0 0 0 5px #3ad0f0,0 0 24px #3ad0f066;width:100%}
.glow{color:var(--cy);text-shadow:0 0 12px #5ee7ffaa,0 0 2px #fff}
h1{margin:0;font-size:56px;font-weight:900;line-height:1.3;background:linear-gradient(#fff,#6fe9ff 60%,#2ab4d6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px #5ee7ff)}
h2{margin:0;font-size:22px;font-weight:900}
.hud{background:rgba(8,20,44,.82);border:3px solid var(--cy);border-radius:18px;box-shadow:0 0 18px #5ee7ff44,inset 0 0 22px #5ee7ff18;width:100%;padding:16px}
p{margin:0;line-height:1.9;font-size:15.5px}
#inp{width:100%;font:700 20px 'Cairo',sans-serif;text-align:center;color:#fff;background:rgba(10,30,50,.75);border:3px solid var(--cy);border-radius:16px;padding:12px;outline:none;box-shadow:0 0 16px #5ee7ff66,inset 0 0 14px #5ee7ff33}
#inp::placeholder{color:#8db8c8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.lb{position:relative;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(#16335a,#0b1a34);border:3px solid var(--cy);border-radius:18px;box-shadow:0 0 14px #5ee7ff55,inset 0 0 18px #5ee7ff22;font-size:17px;font-weight:900;transition:transform .12s,filter .15s}
.lb:hover{filter:brightness(1.25);transform:scale(1.04)}.lb:active{transform:scale(.94)}
.lb .p{width:64px;height:64px}.lb small{font-size:11.5px;font-weight:700;color:#9fd8ea;line-height:1.3;padding:0 8px}
.ck{position:absolute;top:-8px;left:-8px;width:30px;height:30px;border-radius:50%;background:#2faa63;border:3px solid #d2ffe3;font-size:16px;display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:5px}.dots i{width:24px;height:10px;border-radius:5px;background:#24405a}.dots i.on{background:var(--cy);box-shadow:0 0 8px var(--cy)}
.bar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.fact{display:flex;align-items:center;gap:8px;margin-top:12px;background:#1b2f55;border:2px solid #ffb04a;border-radius:14px;padding:8px 10px;font-size:13.5px;line-height:1.7;text-align:right}
.fact svg{width:46px;height:70px;flex:none}
.fb{min-height:30px;font-weight:900;font-size:17px;margin-top:10px}.fb.ok{color:#6df0a2}.fb.no{color:#ff8f8f}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.dnd{display:grid;grid-template-columns:auto 1fr;gap:16px;width:100%;margin-top:6px}.col{display:flex;flex-direction:column;gap:12px}
.chip{width:76px;height:76px;padding:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a5d8a,#0e2442);border:3px solid var(--cy);box-shadow:0 0 14px #5ee7ff77;cursor:grab;touch-action:none;position:relative;z-index:2}
.chip.drag{z-index:50;cursor:grabbing;box-shadow:0 0 26px var(--cy)}.chip.back{transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.chip.done{width:56px;height:56px;padding:5px;transform:none!important;cursor:default;border-color:#6df0a2}
.target{height:76px;border:3px dashed #5ee7ff99;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:15px;background:rgba(8,20,44,.6)}
.target.full{border:3px solid #6df0a2;background:#2faa6322}
#mute{position:absolute;top:10px;left:10px;z-index:20;width:36px;height:36px;border-radius:50%;background:#0b1a30cc;border:2px solid #5ee7ff88;display:flex;align-items:center;justify-content:center}
#mute svg{width:20px;height:20px}#mute .x{display:none}#mute.m .w{display:none}#mute.m .x{display:block}
</style>
</head>

function T(f,t,d,y,v,f2){if(!AC)return;var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.type=y||"sine";o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v||.2,n+.015);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(M);o.start(n);o.stop(n+d+.05)}
function Nz(d,a,b,v){if(!AC)return;var n=AC.currentTime,len=AC.sampleRate*d|0,buf=AC.createBuffer(1,len,AC.sampleRate),x=buf.getChannelData(0);for(var i=0;i<len;i++)x[i]=Math.random()*2-1;
 var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=buf;f.type="bandpass";f.Q.value=1.2;f.frequency.setValueAtTime(a,n);f.frequency.exponentialRampToValueAtTime(b,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+d*.4);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(M);s.start(n)}
var S={
 click:function(){T(640,0,.07,"square",.07,320)},

 ok:function(){[523,659,784,1047].forEach(function(f,i){T(f,i*.09,.28,"triangle",.22)})},

 pick:function(){T(480,0,.1,"sine",.2,900)},

function music(){var A=[220,261.63,293.66,329.63,392,440,523.25];
 [110,164.81].forEach(function(f){var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(MU);o.start()});
 setInterval(function(){if(!AC||AC.state!=="running")return;var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type="triangle";o.frequency.value=A[Math.random()*A.length|0];g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.07,n+.4);g.gain.exponentialRampToValueAtTime(.001,n+2.6);o.connect(g);g.connect(MU);o.start(n);o.stop(n+2.7)},1300)}

 userName=v;S.launch();setTimeout(menu,500)};

var ORD=["الأول","الثاني","الثالث","الرابع"];
var LESSONS=[
{ic:"sun",t:"الشمس والمجموعة الشمسية",txt:"الشمس نجم ضخم يقع في مركز المجموعة الشمسية، وهي مصدر الضوء والحرارة لجميع الكواكب. يدور حولها ثمانية كواكب، ويدور حول بعضها أقمار.",fact:"يتسع حجم الشمس لأكثر من مليون كوكب بحجم الأرض!",q:"الشمس كوكب من كواكب المجموعة الشمسية.",a:false,why:"الشمس نجم وليست كوكباً.",dnd:[["sun","نجم"],["earth","كوكب"],["moon","قمر"]]},
{ic:"saturn",t:"الكواكب",txt:"الأرض هي الكوكب الثالث بعداً عن الشمس. يُسمّى المريخ الكوكب الأحمر بسبب لون تربته، أما زحل فتحيط به حلقات رائعة من الجليد والصخور.",fact:"كثافة زحل أقل من كثافة الماء، فلو وُجد محيط ضخم بما يكفي لطفا فوقه!",q:"الأرض هي الكوكب الثالث بعداً عن الشمس.",a:true,why:"تأتي بعد عطارد والزهرة مباشرة.",dnd:[["saturn","الكوكب ذو الحلقات"],["mars","الكوكب الأحمر"],["earth","الكوكب الأزرق"]]},
{ic:"moon",t:"القمر",txt:"القمر هو التابع الطبيعي الوحيد للأرض، ويدور حولها مرة كل شهر تقريباً. يتغيّر شكله في السماء بحسب موقعه من الشمس والأرض، وتُسمّى هذه التغيّرات أطوار القمر.",fact:"يبتعد القمر عن الأرض نحو ٣٫٨ سم كل عام.",q:"يدور القمر حول الأرض.",a:true,why:"فهو تابعها الطبيعي.",dnd:[["pnew","المحاق"],["pq","التربيع"],["pfull","البدر"]]},
{ic:"rocket",t:"الصواريخ ورحلات الفضاء",txt:"ينطلق الصاروخ إلى أعلى لأنه يدفع غازات ساخنة إلى أسفل بقوة. وتحمل الصواريخ الأقمار الصناعية إلى مداراتها، وتنقل روّاد الفضاء إلى محطة الفضاء الدولية.",fact:"يشاهد روّاد المحطة الدولية شروق الشمس نحو ١٦ مرة في اليوم الواحد!",q:"يمكننا سماع الأصوات في الفضاء الخارجي.",a:false,why:"الفضاء شبه خالٍ، والصوت يحتاج إلى وسط مثل الهواء لينتقل.",dnd:[["rocket","صاروخ"],["sat","قمر صناعي"],["kid","رائد فضاء"]]}];
function ic(n){return '<svg class="ic"><use href="#'+n+'"/></svg>'}

function menu(){
 $("welcomeText").textContent="مرحباً "+userName;
 $("menu").innerHTML=LESSONS.map(function(l,i){return '<button class="lb tw" data-i="'+i+'">'+(done[i]?'<span class="ck">✓</span>':'')+'<div class="p flt" style="animation-delay:-'+i*.7+'s">'+ic(l.ic)+'</div>الدرس '+ORD[i]+'<small>'+l.t+'</small></button>'}).join("");
 document.querySelectorAll(".lb").forEach(function(b){b.onclick=function(){learn(+b.dataset.i)}});go("f3")}
function bar(n){return '<div class="bar"><button class="ghost" id="bk">← القائمة</button><div class="dots">'+[0,1,2].map(function(k){return '<i class="'+(k<=n?'on':'')+'"></i>'}).join("")+'</div></div>'}
function learn(i){var L=LESSONS[i];
 $("lesson").innerHTML=bar(0)+'<div class="hud tw"><div style="width:70px;height:70px;margin:-4px auto 4px" class="flt">'+ic(L.ic)+'</div><h2 class="glow">'+L.t+'</h2><p style="margin-top:10px;text-align:right">'+L.txt+'</p><div class="fact"><svg viewBox="0 0 100 150" style="--hair:#5a3420;--skin:#f0b48a"><use href="#kid"/></svg><span><b style="color:#ffb04a">هل تعلم؟</b> '+L.fact+'</span></div></div><button id="nx" class="btn or tw" style="margin-top:18px">اختبر نفسك</button>';
 $("bk").onclick=menu;$("nx").onclick=function(){tf(i)};go("lesson")}
function tf(i){var L=LESSONS[i];
 $("lesson").innerHTML=bar(1)+'<div class="hud tw" style="margin-top:8px"><h2 class="glow">صح أم خطأ؟</h2><p style="font-size:19px;font-weight:700;margin:14px 0 18px">'+L.q+'</p><div style="display:flex;gap:14px;justify-content:center"><button id="yes" class="btn gb">✔ صح</button><button id="no" class="btn rb">✘ خطأ</button></div></div><div class="fb" id="fb"></div><button id="nx" class="btn or tw" style="margin-top:8px" disabled>التمرين التالي</button>';
 $("bk").onclick=menu;
 function ans(v){var f=$("fb");
  if(v===L.a){S.ok();f.className="fb ok";f.textContent="أحسنت يا "+userName+"! "+L.why;$("yes").disabled=$("no").disabled=true;$("nx").disabled=false}
  else{S.no();f.className="fb no shake";f.textContent="إجابة خاطئة، حاول مرة أخرى";setTimeout(function(){f.classList.remove("shake")},400)}}
 $("yes").onclick=function(){ans(true)};$("no").onclick=function(){ans(false)};$("nx").onclick=function(){dnd(i)};go("lesson")}
function dnd(i){var L=LESSONS[i],S2=$("lesson"),left=L.dnd.length;
 var ord=L.dnd.map(function(_,k){return k}).sort(function(){return Math.random()-.5});
 S2.innerHTML=bar(2)+'<h2 class="glow tw">اسحب كل صورة إلى مكانها الصحيح</h2><div class="dnd tw"><div class="col">'+ord.map(function(k){return '<div class="chip" data-k="'+k+'">'+ic(L.dnd[k][0])+'</div>'}).join("")+'</div><div class="col">'+L.dnd.map(function(d,k){return '<div class="target" data-k="'+k+'">'+d[1]+'</div>'}).join("")+'</div></div><div class="fb" id="fb"></div>';

  c.onpointermove=function(e){if(c.classList.contains("drag"))c.style.transform="translate("+(e.clientX-sx)/sc+"px,"+(e.clientY-sy)/sc+"px) scale(1.12)"};
  c.onpointerup=function(e){if(!c.classList.contains("drag"))return;c.classList.remove("drag");
   var t=null;document.elementsFromPoint(e.clientX,e.clientY).forEach(function(el){if(el.classList&&el.classList.contains("target"))t=el});
   if(t&&t.dataset.k===c.dataset.k&&!t.classList.contains("full")){S.snap();setTimeout(S.ok,120);c.style.transform="";c.classList.add("done");t.classList.add("full");t.insertBefore(c,t.firstChild);left--;
    if(!left){done[i]=1;setTimeout(S.win,500);$("fb").className="fb ok";$("fb").textContent="ممتاز يا "+userName+"! أنهيت الدرس";var b=document.createElement("button");b.className="btn or tw-on";b.style.marginTop="12px";b.textContent="العودة إلى القائمة";b.onclick=menu;S2.appendChild(b)}}
